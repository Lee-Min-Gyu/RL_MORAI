[ros]
enabled = true
node_name = "morai_rl"
anonymous = true
user_id = "morai_rl"
entity_id = "EGO"
ego_topic = "/Ego_topic"
imu_topic = "/imu"
object_topic = "/Object_topic"
sync_info_topic = "/SyncModeInfo"
ctrl_topic = "/ctrl_cmd_0"
sync_mode_cmd_service = "/SyncModeCmd"
wait_for_tick_service = "/SyncModeWaitForTick"
sync_ctrl_cmd_service = "/SyncModeCtrlCmd"
sync_set_gear_service = "/SyncModeSetGear"
sync_scenario_load_service = "/SyncModeScenarioLoad"
sync_scenario_load_post_ticks = 0
sync_scenario_load_post_gear = 1
use_sync_mode = true
start_sync_on_start = true
stop_sync_on_close = true
time_step = 20
sensor_capture = false
service_timeout_sec = 30.0
wait_for_tick_timeout_sec = 10.0

[env]
step_hz = 50.0
action_repeat = 1
max_steps = 6000
target_speed_mps = 12.0
max_progress_speed_mps = 55.5555555556 # 200 km/h
action_mode = "throttle_brake_steering"
steering_only_control = false
steering_only_fixed_throttle = 0.45
steering_only_fixed_brake = 0.0
progress_reward_scale = 6.0
alive_bonus = 0.0
step_penalty = 0.01
steering_delta_penalty_scale = 0.1
brake_penalty_scale = 0.005
boundary_proximity_penalty_scale = 0.03
boundary_proximity_margin_m = 0.5
lateral_error_penalty_scale = 0.15
lateral_error_penalty_clip_m = 3.0
heading_error_penalty_scale = 0.5
heading_error_penalty_clip_rad = 1.0
off_track_penalty = 1500.0
done_stop_duration_sec = 0.5
off_track_distance_m = 3.0
state_timeout_sec = 1.0
no_progress_window_steps = 200
no_progress_epsilon_m = 0.5
reverse_progress_window_steps = 10
reverse_progress_threshold_m = -0.5
stalled_penalty = 1000.0
state_timeout_penalty = 20.0

[reset]
command = ""
scenario_load_enabled = true
scenario_load_file_name = "ROS_RL"
scenario_load_file_names = ["ROS_RL9","ROS_RL10"]
scenario_selection_mode = "round_robin"
scenario_delete_all = false
scenario_load_network_connection_data = true
scenario_load_ego_vehicle_data = true
scenario_load_surrounding_vehicle_data = false
scenario_load_pedestrian_data = false
scenario_load_object_data = false
scenario_set_pause = false
reset_mode = "scenario_load"
full_reload_interval = 0
command_timeout_sec = 20.0
min_reset_interval_sec = 0.0
post_command_wait_sec = 2.0
stable_speed_tolerance_mps = 0.3
stable_position_tolerance_m = 0.5
stable_frames_required = 1
reset_timeout_sec = 20.0
allow_unstable_reset = true
max_reset_attempts = 3
reset_retry_wait_sec = 10.0

[path]
csv_path = "../output/reference_path_centerline_kcity_2025.csv"

[route]
enabled = true
link_set_path = "../MORAI-ADModule/mgeo/lib/mgeo_data/R_KR_PR_K-City_2025/link_set.json"
corridor_selection_path = "../output/selected_links_2025_kcity.json"
corridor_selection_key = "selected_link_ids"
corridor_margin_m = 0.15

[observation]
mode = "hybrid"
vector_profile = "racing_guide"
lookahead_distances_m = [5.0, 10.0, 15.0, 20.0, 25.0, 30.0]
guide_dropout_prob = 0.0

[bev]
width_px = 192
height_px = 192
front_range_m = 30.4
rear_range_m = 8.0
left_range_m = 19.2
right_range_m = 19.2
include_lane_marking = false
static_bev_npz_path = "../output/kcity_2025_selected_links_bev/static_bev.npz"
static_bev_metadata_path = "../output/kcity_2025_selected_links_bev/static_bev_metadata.json"
lane_marking_path = "../MORAI-ADModule/mgeo/lib/mgeo_data/R_KR_PR_K-City_2025/lane_marking_set.json"
corridor_boundary_width_m = 0.2
centerline_width_m = 0.3
lane_marking_min_width_m = 0.15
ego_vehicle_length_m = 4.845
ego_vehicle_width_m = 1.835
ego_vehicle_offset_forward_m = 1.3375

[recovery]
enabled = true
simulator_process_names = ["Simulator.x86_64"]
relaunch_cleanup_cmdline_substrings = [
  "roslaunch msc_ros msc_ros.launch",
  "msc_ros/scripts/api.py",
]
terminate_timeout_sec = 5.0
relaunch_command = "roslaunch msc_ros msc_ros.launch"
relaunch_wait_sec = 60.0
wait_for_services = true
wait_services_timeout_sec = 300.0
wait_services_poll_sec = 2.0
post_services_wait_sec = 15.0
